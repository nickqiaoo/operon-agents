name: Publish

# Publishes every public package at the version currently in its package.json.
# Trigger it by hand from the Actions tab after bumping versions and merging.
on:
  workflow_dispatch:
    inputs:
      tag:
        # Only this one tag moves. OIDC covers `npm publish` alone, so the workflow cannot
        # run `npm dist-tag add` to point a second tag at the release — that needs a stored
        # token, which is exactly what trusted publishing exists to avoid. Pick `latest` for
        # anything a plain `npm install` should resolve to.
        description: "npm dist-tag to publish under (the only tag that will move)"
        required: true
        default: latest
        type: choice
        options: [latest, alpha, next]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing: the OIDC token is what npm verifies
      # instead of a long-lived token stored in this repo.
      id-token: write
      # Needed to push the release tag and create the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs npm 11.5.1+; Node 24 ships an older npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure ripgrep
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present"
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      # Never publish something that does not build and pass its tests.
      - name: Build (clean)
        run: pnpm build:clean

      - name: Typecheck
        run: pnpm -r --parallel typecheck

      - name: Test
        run: pnpm -r test

      # pnpm resolves workspace:* to real versions when packing; npm then publishes the
      # tarballs, so the two steps stay separate and each does what it is good at.
      - name: Pack
        run: pnpm pack:all

      - name: Publish
        env:
          # Passed as an env var rather than interpolated into the script body.
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Dependencies first. Each tarball is named exactly rather than globbed: a
          # `operon-agents-*.tgz` pattern also matches operon-agents-core and -peers.
          for entry in operon-agents-core:agents-core \
                       operon-agents:agents \
                       operon-agents-peers:agents-peers \
                       operon-managed-agents:managed-agents \
                       operon-sandbox:sandbox \
                       operon-os-sandbox:os-sandbox; do
            pkg="${entry%%:*}"
            dir="${entry##*:}"
            version=$(node -p "require('./packages/$dir/package.json').version")
            tarball="./dist-tarballs/$pkg-$version.tgz"
            # Publishing six packages is not atomic: if one fails partway the earlier ones are
            # already on the registry, and re-running would die on "cannot publish over an
            # existing version". Skipping what is already there makes a re-run finish the job
            # instead of failing at the first package.
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "⏭  $pkg@$version is already on the registry, skipping"
              continue
            fi
            echo "▶ publishing $pkg@$version"
            npm publish "$tarball" --access public --tag "$TAG"
          done

      # Only reached when every package published. A tag is what ties a version on npm back to
      # the code that produced it — without one, "I'm on alpha.1" cannot be resolved to a commit.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/agents/package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "⏭  $tag already exists, skipping"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          # A hyphen in the version is what makes it a pre-release: 0.1.0-alpha.1 has one,
          # 0.1.0 does not. GitHub keeps pre-releases out of the "Latest release" slot.
          case "$version" in
            *-*) gh release create "$tag" --title "$tag" --generate-notes --prerelease ;;
            *)   gh release create "$tag" --title "$tag" --generate-notes ;;
          esac
